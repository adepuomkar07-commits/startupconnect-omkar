<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StartupConnect - Register</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );
            padding: 30px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo i {
            font-size: 45px;
            color: #2563eb;
        }

        .logo h1 {
            margin-top: 10px;
            color: #111827;
        }

        .logo p {
            color: #6b7280;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .input-box input,
        .input-box textarea,
        .input-box select {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .input-box textarea {
            min-height: 90px;
            resize: vertical;
        }

        .input-box input:focus,
        .input-box textarea:focus,
        .input-box select:focus {
            border-color: #2563eb;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
        }

        .register-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="logo">

        <i class="fa-solid fa-rocket"></i>

        <h1>StartupConnect</h1>

        <p>Create your founder account</p>

    </div>


    <form id="registerForm">


        <div class="form-group">

            <label for="startupName">
                Startup Name
            </label>

            <div class="input-box">

                <i class="fa-solid fa-building"></i>

                <input
                    type="text"
                    id="startupName"
                    placeholder="Enter startup name"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label for="founderName">
                Founder Name
            </label>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="founderName"
                    placeholder="Enter founder name"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-box password-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required>

                <span
                    class="toggle-password"
                    id="togglePassword">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

        </div>


        <div class="form-group">

            <label for="industry">
                Industry
            </label>

            <div class="input-box">

                <i class="fa-solid fa-layer-group"></i>

                <select id="industry">

                    <option value="">
                        Select Industry
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="FinTech">
                        FinTech
                    </option>

                    <option value="HealthTech">
                        HealthTech
                    </option>

                    <option value="EdTech">
                        EdTech
                    </option>

                    <option value="AgriTech">
                        AgriTech
                    </option>

                    <option value="E-Commerce">
                        E-Commerce
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label for="description">
                Startup Description
            </label>

            <div class="input-box">

                <i class="fa-solid fa-align-left"></i>

                <textarea
                    id="description"
                    placeholder="Describe your startup"></textarea>

            </div>

        </div>


        <button
            type="submit"
            class="register-btn"
            id="registerBtn">

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </button>


        <div
            class="message"
            id="message">
        </div>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script src="register.js"></script>

</body>

</html>
