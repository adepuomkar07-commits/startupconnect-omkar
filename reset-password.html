<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | StartupConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #7c3aed,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #4f46e5,
                    transparent 35%
                ),
                #0f172a;
        }

        .card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.3);
        }

        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: 800;

            color: #172033;

            margin-bottom: 25px;
        }

        .logo span {
            color: #7c3aed;
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ede9fe;

            color: #7c3aed;

            font-size: 27px;
        }

        h1 {

            text-align: center;

            font-size: 22px;

            color: #172033;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 10px;

            line-height: 1.7;

            margin: 10px 0 25px;
        }

        .email-box {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 9px;

            padding: 10px;

            margin-bottom: 20px;

            text-align: center;

            color: #64748b;

            font-size: 9px;
        }

        .email-box strong {
            color: #334155;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {

            display: block;

            font-size: 9px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box > i:first-child {

            position: absolute;

            left: 13px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 12px;
        }

        .toggle-password {

            position: absolute;

            left: auto !important;

            right: 13px;

            cursor: pointer;

            color: #94a3b8;

            z-index: 2;
        }

        input {

            width: 100%;

            padding: 12px 40px 12px 38px;

            border: 1px solid #dbe1ea;

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 10px;
        }

        input:focus {

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124, 58, 237, 0.08);
        }

        .password-rules {

            background: #f8fafc;

            border-radius: 10px;

            padding: 12px;

            margin-top: 8px;

            margin-bottom: 18px;
        }

        .rule {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #94a3b8;

            font-size: 8px;

            margin: 5px 0;
        }

        .rule.valid {
            color: #16a34a;
        }

        .rule i {
            font-size: 8px;
        }

        button {

            width: 100%;

            border: 0;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #5b21b6
                );

            color: white;

            padding: 13px;

            border-radius: 10px;

            font-family: inherit;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #6d28d9;

            transform: translateY(-1px);
        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            text-align: center;

            font-size: 9px;

            line-height: 1.5;

            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {

            background: #dcfce7;

            color: #166534;
        }

        .message.error {

            background: #fee2e2;

            color: #991b1b;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #7c3aed;

            text-decoration: none;

            font-size: 10px;

            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {

            .card {
                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


<div class="card">


    <div class="logo">
        Startup<span>Connect</span>
    </div>


    <div class="icon">
        <i class="fa-solid fa-lock"></i>
    </div>


    <h1>
        Create New Password
    </h1>


    <p class="subtitle">

        Your verification was successful.
        Create a strong new password for your account.

    </p>


    <div class="email-box">

        Resetting password for:

        <strong id="emailDisplay">
            your email
        </strong>

    </div>


    <form id="resetForm">


        <div class="form-group">

            <label for="newPassword">
                NEW PASSWORD
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                >

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="toggleNewPassword">
                </i>

            </div>

        </div>


        <div class="password-rules">

            <div
                class="rule"
                id="lengthRule">

                <i class="fa-solid fa-circle"></i>

                At least 6 characters

            </div>


            <div
                class="rule"
                id="numberRule">

                <i class="fa-solid fa-circle"></i>

                Contains a number

            </div>


            <div
                class="rule"
                id="uppercaseRule">

                <i class="fa-solid fa-circle"></i>

                Contains an uppercase letter

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                CONFIRM PASSWORD
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    required
                >

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="toggleConfirmPassword">
                </i>

            </div>

        </div>


        <button
            type="submit"
            id="resetButton">

            <i class="fa-solid fa-key"></i>

            &nbsp;

            Reset Password

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="login.html"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Login

    </a>


</div>


<script>
/* =========================================
   ELEMENTS
========================================= */

const resetForm =
    document.getElementById("resetForm");

const newPassword =
    document.getElementById("newPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const resetButton =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");

const emailDisplay =
    document.getElementById("emailDisplay");

const lengthRule =
    document.getElementById("lengthRule");

const numberRule =
    document.getElementById("numberRule");

const uppercaseRule =
    document.getElementById("uppercaseRule");


/* =========================================
   GET VERIFIED RESET DATA
========================================= */

const codeVerified =
    localStorage.getItem("codeVerified");

const resetEmail =
    localStorage.getItem("verifiedResetEmail");

const verificationCode =
    localStorage.getItem("verificationCode");


/* =========================================
   CHECK VERIFICATION
========================================= */

if (
    codeVerified !== "true" ||
    !resetEmail ||
    !verificationCode
) {

    window.location.href =
        "forgot-password.html";

} else {

    emailDisplay.textContent =
        resetEmail;

}


/* =========================================
   PASSWORD TOGGLE
========================================= */

document
    .getElementById("toggleNewPassword")
    .addEventListener(
        "click",
        function () {

            togglePassword(
                newPassword,
                this
            );

        }
    );


document
    .getElementById("toggleConfirmPassword")
    .addEventListener(
        "click",
        function () {

            togglePassword(
                confirmPassword,
                this
            );

        }
    );


function togglePassword(input, icon) {

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove(
            "fa-eye"
        );

        icon.classList.add(
            "fa-eye-slash"
        );

    } else {

        input.type = "password";

        icon.classList.remove(
            "fa-eye-slash"
        );

        icon.classList.add(
            "fa-eye"
        );

    }

}


/* =========================================
   PASSWORD RULES
========================================= */

newPassword.addEventListener(
    "input",
    function () {

        const password =
            newPassword.value;


        /* LENGTH */

        if (password.length >= 6) {

            makeValid(lengthRule);

        } else {

            makeInvalid(lengthRule);

        }


        /* NUMBER */

        if (/\d/.test(password)) {

            makeValid(numberRule);

        } else {

            makeInvalid(numberRule);

        }


        /* UPPERCASE */

        if (/[A-Z]/.test(password)) {

            makeValid(uppercaseRule);

        } else {

            makeInvalid(uppercaseRule);

        }

    }
);


function makeValid(element) {

    element.classList.add("valid");

    const icon =
        element.querySelector("i");

    icon.className =
        "fa-solid fa-circle-check";

}


function makeInvalid(element) {

    element.classList.remove("valid");

    const icon =
        element.querySelector("i");

    icon.className =
        "fa-solid fa-circle";

}


/* =========================================
   RESET PASSWORD
========================================= */

resetForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const password =
            newPassword.value;

        const confirm =
            confirmPassword.value;


        /* =====================================
           VALIDATE LENGTH
        ===================================== */

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        /* =====================================
           VALIDATE NUMBER
        ===================================== */

        if (!/\d/.test(password)) {

            showMessage(
                "Password must contain at least one number.",
                "error"
            );

            return;

        }


        /* =====================================
           VALIDATE UPPERCASE
        ===================================== */

        if (!/[A-Z]/.test(password)) {

            showMessage(
                "Password must contain at least one uppercase letter.",
                "error"
            );

            return;

        }


        /* =====================================
           VALIDATE MATCH
        ===================================== */

        if (password !== confirm) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        /* =====================================
           LOADING
        ===================================== */

        resetButton.disabled = true;

        resetButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';


        try {

            /* =================================
               SEND RESET REQUEST
            ================================= */

            const response =
                await fetch(
                    "/api/auth/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email:
                                resetEmail,

                            code:
                                verificationCode,

                            newPassword:
                                password

                        })
                    }
                );


            /* =================================
               READ RESPONSE
            ================================= */

            const data =
                await response.json();


            console.log(
                "RESET PASSWORD RESPONSE:",
                data
            );


            /* =================================
               FAILED
            ================================= */

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Password reset failed."
                );

            }


            /* =================================
               SUCCESS
            ================================= */

            showMessage(
                "Password reset successfully! Redirecting to login...",
                "success"
            );


            resetButton.innerHTML =
                '<i class="fa-solid fa-check"></i> Password Updated';


            /* =================================
               CLEAR RESET DATA
            ================================= */

            localStorage.removeItem(
                "codeVerified"
            );

            localStorage.removeItem(
                "verificationCode"
            );

            localStorage.removeItem(
                "verifiedResetEmail"
            );

            localStorage.removeItem(
                "verificationExpiry"
            );

            localStorage.removeItem(
                "resetEmail"
            );


            /* =================================
               CLEAR OLD LOGIN SESSION
               
               IMPORTANT:
               If the user was previously logged
               in, don't allow the old session to
               remain after password reset.
            ================================= */

            localStorage.removeItem(
                "startupconnect_token"
            );

            localStorage.removeItem(
                "startupconnect_user"
            );

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );

            localStorage.removeItem(
                "loggedIn"
            );

            localStorage.removeItem(
                "isLoggedIn"
            );

            localStorage.removeItem(
                "currentUser"
            );

            localStorage.removeItem(
                "selectedStartup"
            );


            /* =================================
               REDIRECT TO LOGIN
            ================================= */

            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1500
            );

        } catch (error) {

            console.error(
                "❌ RESET PASSWORD ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Unable to reset password.",
                "error"
            );


            resetButton.disabled =
                false;

            resetButton.innerHTML =
                '<i class="fa-solid fa-key"></i> Reset Password';

        }

    }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message show " + type;

}
</script>


</body>

</html>
