<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #eef3ff;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        h1 {
            text-align: center;
            color: #0f62fe;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0f62fe;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #004ad7;
        }

        .info {
            margin-top: 30px;
            text-align: center;
            line-height: 2;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Contact StartupConnect</h1>

        <form>

            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Your Email" required>

            <textarea rows="6" placeholder="Write your message..." required></textarea>

            <button>

                Send Message

            </button>

        </form>

        <div class="info">

            <h3>Email</h3>

            <p>adepuomkar@gmail.com</p>

            <h3>Phone</h3>

            <p>+91 9100410106</p>

            <h3>Address</h3>

            <p>Nizamabad, Telangana, India</p>

        </div>

    </div>

</body>

</html>
