<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Investors Portal</title>

    <link rel="stylesheet" href="investors.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


    <header>

        <h1>🤝 Startup Investors</h1>

        <p>
            Connect with investors across different technology sectors
        </p>

    </header>


    <div class="container">


        <!-- OMKAR -->

        <div class="card">

            <img
                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                alt="Omkar">

            <h2>Omkar</h2>

            <p>Technology Investor</p>

            <button onclick="requestMeeting('Omkar')">

                <i class="fa-solid fa-handshake"></i>
                Request Meeting

            </button>

        </div>



        <!-- ABHISHEK -->

        <div class="card">

            <img
                src="https://cdn-icons-png.flaticon.com/512/3135/3135768.png"
                alt="Abhishek">

            <h2>Abhishek</h2>

            <p>Healthcare Investor</p>

            <button onclick="requestMeeting('Abhishek')">

                <i class="fa-solid fa-handshake"></i>
                Request Meeting

            </button>

        </div>



        <!-- NIKESH -->

        <div class="card">

            <img
                src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
                alt="Nikesh">

            <h2>Nikesh</h2>

            <p>FinTech Investor</p>

            <button onclick="requestMeeting('Nikesh')">

                <i class="fa-solid fa-handshake"></i>
                Request Meeting

            </button>

        </div>


    </div>


    <script src="investors.js"></script>


</body>

</html>
