<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | StartupConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #7c3aed,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #4f46e5,
                    transparent 35%
                ),
                #0f172a;
        }

        .card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.3);
        }

        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: 800;

            color: #172033;

            margin-bottom: 25px;
        }

        .logo span {
            color: #7c3aed;
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ede9fe;

            color: #7c3aed;

            font-size: 27px;
        }

        h1 {

            text-align: center;

            font-size: 22px;

            color: #172033;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 10px;

            line-height: 1.7;

            margin: 10px 0 25px;
        }

        label {

            display: block;

            font-size: 9px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {

            position: absolute;

            left: 13px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 12px;
        }

        input {

            width: 100%;

            padding: 12px 15px 12px 38px;

            border: 1px solid #dbe1ea;

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 10px;
        }

        input:focus {

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124, 58, 237, 0.08);
        }

        button {

            width: 100%;

            border: 0;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #5b21b6
                );

            color: white;

            padding: 13px;

            border-radius: 10px;

            font-family: inherit;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 20px;

            transition: 0.2s;
        }

        button:hover {

            background: #6d28d9;

            transform: translateY(-1px);
        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            text-align: center;

            font-size: 9px;

            line-height: 1.5;

            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {

            background: #dcfce7;

            color: #166534;
        }

        .message.error {

            background: #fee2e2;

            color: #991b1b;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #7c3aed;

            text-decoration: none;

            font-size: 10px;

            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {

            .card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">
        Startup<span>Connect</span>
    </div>

    <div class="icon">
        <i class="fa-solid fa-key"></i>
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">

        Enter your registered email address.
        We'll send you a verification code.

    </p>

    <form id="forgotForm">

        <label for="email">
            EMAIL ADDRESS
        </label>

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <button
            type="submit"
            id="sendButton">

            <i class="fa-solid fa-paper-plane"></i>

            &nbsp;

            Send Verification Code

        </button>

    </form>

    <div
        id="message"
        class="message">
    </div>

    <a
        href="login.html"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Login

    </a>

</div>


<script>

const forgotForm =
    document.getElementById("forgotForm");

const emailInput =
    document.getElementById("email");

const sendButton =
    document.getElementById("sendButton");

const message =
    document.getElementById("message");


forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim().toLowerCase();


        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;

        }


        sendButton.disabled = true;

        sendButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';


        try {

            const response =
                await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to send verification code."
                );

            }


            /*
             * Save ONLY the email.
             * Never save the password.
             */

            localStorage.setItem(
                "resetEmail",
                email
            );


            localStorage.removeItem(
                "codeVerified"
            );

            localStorage.removeItem(
                "verifiedResetEmail"
            );

            localStorage.removeItem(
                "verificationCode"
            );


            showMessage(
                "Verification code sent successfully. Check your email.",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "verify-code.html";

                },
                1200
            );


        } catch (error) {

            console.error(
                "❌ FORGOT PASSWORD ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Unable to connect to the server.",
                "error"
            );


            sendButton.disabled =
                false;

            sendButton.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> &nbsp; Send Verification Code';

        }

    }
);


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " + type;

}

</script>

</body>

</html>
